[project]
name = "tandem-cli"
version = "0.1.0"
description = "Compact CLI for reading and writing tandem-comments blocks in Markdown files"
requires-python = "==3.13.*"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
